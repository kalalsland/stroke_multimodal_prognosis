# Data Configuration for Stroke Multimodal Prognosis
# ===================================================

# Dataset Configuration
dataset:
  type: "MultimodalStrokeDataset"
  modalities: ["image", "text", "tabular"]
  
  # Feature Dimensions
  image_dim: 512
  text_dim: 768
  tabular_dim: 60
  
  # Data Split
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  
  # Class Configuration
  num_classes: 2
  class_names: ["Good", "Poor"]
  
  # Hospital Configuration
  hospitals: ["东方", "普中心", "同济", "新华"]
  
# Data Augmentation
augmentation:
  enabled: true
  use_smote: true
  smote_k_neighbors: 5
  smote_sampling_strategy: "auto"
  
  # Image Augmentation (if using raw images)
  image_aug:
    random_flip: true
    random_rotation: 10
    random_scale: [0.9, 1.1]
  
  # Text Augmentation
  text_aug:
    enabled: false
  
  # Tabular Augmentation
  tabular_aug:
    noise_std: 0.01

# DataLoader Configuration
dataloader:
  batch_size: 32
  num_workers: 4
  shuffle: true
  pin_memory: true
  drop_last: false
  
  # For validation/test
  val_batch_size: 64
  test_batch_size: 64

# Data Preprocessing
preprocessing:
  # Normalization
  normalize_features: true
  normalization_method: "standardize"  # standardize or minmax
  
  # Missing Value Handling
  handle_missing: true
  missing_strategy: "mean"  # mean, median, or zero
  
  # Feature Selection
  feature_selection: false
  selection_method: "variance"
  n_features: null
