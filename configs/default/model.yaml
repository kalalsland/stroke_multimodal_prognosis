# Model Configuration for Stroke Multimodal Prognosis
# ====================================================

# Model Architecture
model:
  type: "MultimodalPrognosisModel"
  
  # Input Dimensions (should match data.yaml)
  image_dim: 512
  text_dim: 768
  tabular_dim: 60
  
  # Feature Projection
  projection:
    hidden_dim: 256
    output_dim: 128
    dropout: 0.3
    use_batch_norm: true
  
  # VDAFM Configuration
  vdafm:
    fusion_dim: 128
    low_rank: 8
    num_heads: 4
    dropout: 0.2
    use_projection_correction: true
    temperature: 0.1
    
  # Classifier Configuration
  classifier:
    hidden_dims: [256, 128]
    num_classes: 2
    dropout: 0.4
    activation: "relu"
    use_batch_norm: true

# Loss Configuration
loss:
  # Classification Loss
  classification:
    type: "cross_entropy"
    weight: 1.0
    label_smoothing: 0.1
    class_weights: null  # [1.0, 1.5] for imbalanced data
  
  # Alignment Loss
  alignment:
    enabled: true
    weight: 0.5
    temperature: 0.07
    loss_type: "infonce"  # infonce or mse
  
  # Contrastive Loss
  contrastive:
    enabled: true
    weight: 0.3
    temperature: 0.1
    margin: 0.5
  
  # Regularization
  regularization:
    l2_weight: 1e-4
    orthogonal_weight: 0.01

# Optimizer Configuration (can be overridden in training.yaml)
optimizer:
  type: "adamw"
  learning_rate: 1e-4
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  eps: 1e-8

# Model Initialization
initialization:
  method: "xavier_uniform"
  gain: 1.0
  bias_init: 0.0
