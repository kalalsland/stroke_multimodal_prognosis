# Base Configuration for Stroke Multimodal Prognosis
# ==================================================

# Project Information
project_name: "stroke_multimodal_prognosis"
experiment_name: "baseline"
version: "1.0.0"

# Device Configuration
device: "cuda"  # cuda or cpu
seed: 39

# Paths Configuration
paths:
  clinic_data: "encoder/label_encoder/Label_data/clinic_data_1.xlsx"
  image_features: "encoder/image_encoder/image_feature/image_feature.xlsx"
  text_features: "encoder/text_encoder/text_feature/medical_text_features_by_qianwen_best.xlsx"
  output_dir: "results/experiments"
  checkpoint_dir: "results/checkpoints"
  log_dir: "results/logs"

# Logging Configuration
logging:
  use_tensorboard: true
  use_wandb: false
  log_interval: 10
  save_interval: 5
